name: Build & publish docker image to AWS ECR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    # ref https://github.com/aws-actions/configure-aws-credentials?tab=readme-ov-file#oidc
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-west-1

    steps:
    - name: Resolve image tag
      id: image
      env:
        DISPATCH_TAG: ${{ github.event.inputs.tag }}
      run: |
        set -euo pipefail
        tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
        case "$tag" in
          v*) ;;
          *)
            echo "ECR publish expects a v* tag, got: $tag" >&2
            exit 1
            ;;
        esac

        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.image.outputs.tag }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Configure AWS Credentials Action for GitHub Actions
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push docker image to Amazon ECR
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/arm64
        provenance: false
        tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ github.event.repository.name }}:${{ steps.image.outputs.tag }}
